<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <pattern id="mow" width="128" height="512" patternUnits="userSpaceOnUse">
      <rect width="64" height="512" fill="#2f9e44"/>
      <rect x="64" width="64" height="512" fill="#37b24d"/>
    </pattern>
  </defs>
  <g clip-path="url(#tile)">
